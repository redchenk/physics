server {
    listen 80;
    listen [::]:80;
    server_name phy.yachiyo.email;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type text/plain;
        root /www/sites/phy.yachiyo.email/index;
        try_files $uri =404;
    }

    location / {
        return 301 https://phy.yachiyo.email$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name phy.yachiyo.email;

    root /www/sites/phy.yachiyo.email/index;
    index index.html;
    charset utf-8;
    http2 on;

    ssl_certificate /www/sites/phy.yachiyo.email/ssl/live/phy.yachiyo.email/fullchain.pem;
    ssl_certificate_key /www/sites/phy.yachiyo.email/ssl/live/phy.yachiyo.email/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_session_cache shared:PhysicsLabSSL:10m;
    ssl_session_timeout 10m;

    access_log /www/sites/phy.yachiyo.email/log/access.log main;
    error_log /www/sites/phy.yachiyo.email/log/error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
